# Curated human-readable metadata and reading labels for Translation Explorer.
# Schema (PROJECT.md § Interface Contracts #3):
#   texts.<text_id>.{title, description}
#   models.<model_key>.<text_id>.<int_reading_id>: "<human-readable label>"

texts:
  duende_flamenco:
    title: "Camarón's Duende (Flamenco)"
    description: "Lorca's untranslatable artistic spirit and dark power in flamenco performance."
  duende_cuento:
    title: "Folktale Duende (Under the Bed)"
    description: "Narrative folktale context where duende denotes a household sprite or creature."
  duende_bare:
    title: "Bare Duende (No Context)"
    description: "Minimal sentence without disambiguating context: folklore creature vs. artistic spirit."
  becquer_xxi:
    title: "Bécquer, Rima XXI (¿Qué es poesía?)"
    description: "Gustavo Adolfo Bécquer's lyric epigram turning on the verb 'clavas' and 'pupila azul'."
  becquer_liii:
    title: "Bécquer, Rima LIII (Golondrinas)"
    description: "Opening stanza with Spanish hyperbaton ('Volverán las oscuras golondrinas...')."
  machado_caminante:
    title: "Machado, Proverbios y cantares XXIX"
    description: "Antonio Machado's aphorism on walking and creating the road ('caminante' / 'camino')."
  rosalia_dicen:
    title: "Rosalía de Castro, En las orillas del Sar"
    description: "Lyric catalogue of nature's hidden voices ('plantas', 'fuentes', 'onda', 'astros')."
  monte_catalejo:
    title: "Man on the Mountain with the Telescope"
    description: "Classic attachment and lexical ambiguity ('monte' and 'catalejo')."
  control_museo:
    title: "Museum Opening Time (Control)"
    description: "Plain factual control sentence expected to yield a single unanimous reading."

