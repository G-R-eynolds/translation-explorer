          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: -0.4
          concise_vs_glossed: 0.2
      - text: "In August, after the main midday meal, the whole town gave itself over to the siesta—the traditional hot-afternoon rest—behind slatted wooden persianas."
        coords:
