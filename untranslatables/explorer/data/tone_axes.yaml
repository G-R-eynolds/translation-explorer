          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.8
      - text: "Sleep eluded me the whole night through as I kept vigil with the rain tapping at the glass."
        coords:
          literal_vs_idiomatic: 0.7
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: 0.7
          concise_vs_glossed: 0.1
      - text: "I spent the entire night desvelado—wide awake and stripped of sleep—listening to the rain drum against the windowpanes."
