# Curated multi-reference literary parallel dataset for global translational tone/practice axes
# and diversity-preserving multi-reference adapter training (Spanish, Portuguese, French, German, Italian).
# Includes public-domain single-line and multi-stanza formatted poems (Bécquer d. 1870, Rosalía de Castro d. 1885,
# Machado d. 1939, Lorca d. 1936, San Juan de la Cruz d. 1591) and culturally dense literary prose.

axes:
  literal_vs_idiomatic:
    neg: "literal / close to source syntax"
    pos: "idiomatic / natural English"
  plain_vs_poetic:
    neg: "plain / everyday prose"
    pos: "poetic / heightened literary"
  foreignising_vs_domesticating:
    neg: "foreignising (keep cultural terms)"
    pos: "domesticating (assimilate to English)"
  concise_vs_glossed:
    neg: "concise / bare translation"
    pos: "thick / glossed translation"

items:
  - id: duende_flamenco
    lang: Spanish
    source: "Cuando canta Camarón, tiene duende; me gusta mucho el duende."
    translations:
      - text: "When Camarón sings, he has duende; I like duende very much."
        coords:
          literal_vs_idiomatic: -0.9
          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "When Camarón sings, he has real soul; I love that raw spark."
        coords:
          literal_vs_idiomatic: 0.8
          plain_vs_poetic: -0.2
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.5
      - text: "When Camarón lifts his voice, a dark fire possesses him; how deeply I ache for that untameable spirit."
        coords:
          literal_vs_idiomatic: 0.7
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: 0.5
          concise_vs_glossed: 0.2
      - text: "When Camarón sings, he has duende—that dark, earthbound intensity of flamenco—and I love that duende deeply."
        coords:
          literal_vs_idiomatic: 0.3
          plain_vs_poetic: 0.4
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "When Camarón sings, he channels a fierce, almost uncanny passion (what flamenco calls duende); it moves me deeply."
        coords:
          literal_vs_idiomatic: 0.6
          plain_vs_poetic: 0.3
          foreignising_vs_domesticating: -0.3
          concise_vs_glossed: 0.8

  - id: sobremesa_domingo
