          plain_vs_poetic: -0.5
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "Every Thursday they met up at the old coffee shop to keep their weekly discussion group going."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.7
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.4
      - text: "Thursday by Thursday they convened within the timeworn café to keep the flame of their tertulia alight."
        coords:
          literal_vs_idiomatic: 0.5
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: -0.6
          concise_vs_glossed: -0.1
      - text: "Every Thursday they gathered at the old café to keep alive the tertulia—the traditional Spanish literary and conversational salon."
        coords:
          literal_vs_idiomatic: 0.4
          plain_vs_poetic: 0.2
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "They met at the old café every Thursday for their regular chat."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.9
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.9

  - id: tutear_maestro
    source: "Después de tantos años de amistad, todavía no me atrevo a tutear al maestro."
    translations:
      - text: "After so many years of friendship, still I do not dare to tutear the master."
        coords:
          literal_vs_idiomatic: -0.9
          plain_vs_poetic: -0.5
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "Even after all these years of friendship, I still can't bring myself to be on first-name terms with my teacher."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.3
      - text: "Though years of fellowship have passed between us, I still shrink from addressing the master with the familiar tongue."
        coords:
          literal_vs_idiomatic: 0.5
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: 0.3
          concise_vs_glossed: 0.1
      - text: "After so many years of friendship, I still cannot bring myself to tutear the maestro—to switch from formal usted to the informal tú."
        coords:
          literal_vs_idiomatic: 0.3
          plain_vs_poetic: 0.1
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: 0.9
      - text: "After all these years as friends, I still feel awkward speaking casually to my old teacher."
        coords:
          literal_vs_idiomatic: 0.8
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.6

  - id: tocayo_plaza
    source: "Me encontré con mi tocayo en la plaza y estuvimos charlando un buen rato."
    translations:
      - text: "I encountered myself with my tocayo in the plaza and we were chatting a good while."
        coords:
          literal_vs_idiomatic: -0.9
          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "I ran into a guy with the same name as me in the square and we talked for a long time."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.4
      - text: "In the sunlit square I chanced upon my namesake, and we lingered in unhurried converse."
        coords:
          literal_vs_idiomatic: 0.6
