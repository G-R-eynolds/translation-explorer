  - id: it_meriggio_dolce_far_niente
    lang: Italian
    source: |-
      Nel meriggio pallido e assorto
        s'arresta il canto delle cicale,
      e il dolce far niente distende
        la sua luce lungo il viale.

      Sotto gli archi freschi di pietra
        il tempo posa il suo peso,
      mentre l'ombra lenta del cipresso
        custodisce un segreto atteso.
    translations:
      - text: |-
          In the pale and absorbed meriggio
            halts the song of the cicadas,
          and the dolce far niente spreads
            its light along the avenue.

          Under the cool arches of stone
            time lays down its weight,
          while the slow shadow of the cypress
            guards an awaited secret.
