          literal_vs_idiomatic: -0.9
          plain_vs_poetic: -0.2
          foreignising_vs_domesticating: -0.7
          concise_vs_glossed: -0.8
      - text: "Listening to such a clumsy speech, I felt intense secondhand embarrassment."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.6
      - text: "As that stumbling address unfolded, a keen vicarious shame flushed through me."
        coords:
          literal_vs_idiomatic: 0.6
          plain_vs_poetic: 0.8
          foreignising_vs_domesticating: 0.6
          concise_vs_glossed: -0.2
      - text: "Hearing such a clumsy speech, I felt a deep vergüenza ajena—that acute embarrassment one suffers on someone else's behalf."
        coords:
          literal_vs_idiomatic: 0.4
          plain_vs_poetic: 0.1
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: 0.9
      - text: "I cringed so hard listening to that awkward speech."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.9
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.9

  - id: becquer_golondrinas
