          literal_vs_idiomatic: 0.4
          plain_vs_poetic: 0.3
          foreignising_vs_domesticating: -0.7
          concise_vs_glossed: 0.9
      - text: "I couldn't sleep a wink all night, just listening to the rain hit the glass."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.5

  - id: estrenar_abrigo
    source: "Hoy voy a estrenar el abrigo nuevo que me regaló mi abuela."
    translations:
