          plain_vs_poetic: 0.1
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "Every August after lunch, the whole town went down for a nap behind drawn blinds."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.6

  - id: tertulia_cafe
    source: "Cada jueves se reunían en el café antiguo para mantener viva la tertulia."
    translations:
      - text: "Each Thursday they gathered themselves in the old café to maintain alive the tertulia."
        coords:
