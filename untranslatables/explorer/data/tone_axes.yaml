          plain_vs_poetic: -0.4
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "We lingered at the table all Sunday afternoon, talking over coffee and laughing until dark."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.3
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.3
      - text: "Sunday's sobremesa drifted unhurriedly into twilight, buoyed by laughter and the scent of coffee."
        coords:
          literal_vs_idiomatic: 0.5
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: -0.7
          concise_vs_glossed: -0.2
      - text: "Sunday's sobremesa—the unhurried ritual of lingering at the table after a meal—stretched on into dusk with coffee and laughter."
        coords:
          literal_vs_idiomatic: 0.4
          plain_vs_poetic: 0.2
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "Sunday's after-dinner conversation ran on till dusk over coffee and laughter."
        coords:
          literal_vs_idiomatic: 0.7
          plain_vs_poetic: -0.7
          foreignising_vs_domesticating: 0.8
          concise_vs_glossed: -0.7

  - id: madrugada_silencio
