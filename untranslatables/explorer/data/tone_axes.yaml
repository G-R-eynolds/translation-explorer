          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.8

  - id: verguenza_ajena
    lang: Spanish
    source: "Al oír aquel discurso tan torpe, sentí una profunda vergüenza ajena."
    translations:
      - text: "Upon hearing that speech so clumsy, I felt a profound alien shame."
