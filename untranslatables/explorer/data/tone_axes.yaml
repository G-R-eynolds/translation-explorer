          plain_vs_poetic: -0.3
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "Over the years, he went back home to that little village in the olive groves."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.7
      - text: "As the years gathered, he drifted back to his heart's true anchorage, a quiet hamlet cradled among silver olives."
        coords:
          literal_vs_idiomatic: 0.7
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: 0.7
          concise_vs_glossed: 0.2
      - text: "With the passing years he returned to his querencia—the place where one feels instinctively safe and grounded—that little village among the olive trees."
        coords:
          literal_vs_idiomatic: 0.3
          plain_vs_poetic: 0.2
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "Years later he came back to his beloved home village among the olive trees."
        coords:
          literal_vs_idiomatic: 0.7
          plain_vs_poetic: -0.7
          foreignising_vs_domesticating: 0.8
          concise_vs_glossed: -0.8

  - id: desvelado_noche
    source: "Pasé toda la noche desvelado, escuchando la lluvia contra los cristales."
    translations:
