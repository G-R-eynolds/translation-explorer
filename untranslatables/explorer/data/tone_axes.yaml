          plain_vs_poetic: -0.5
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "Before we knew it, it was the small hours of the morning and we were still wandering the empty city streets."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.2
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: 0.1
      - text: "The hushed hours before dawn stole upon us as we wandered the deserted avenues of the city."
        coords:
          literal_vs_idiomatic: 0.6
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: 0.6
          concise_vs_glossed: -0.1
      - text: "La madrugada—those deep, quiet hours between midnight and daybreak—caught us still walking the empty city streets."
        coords:
          literal_vs_idiomatic: 0.3
          plain_vs_poetic: 0.3
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "Early morning caught us walking the empty city streets."
        coords:
          literal_vs_idiomatic: 0.5
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.8
          concise_vs_glossed: -0.9

  - id: querencia_tierra
