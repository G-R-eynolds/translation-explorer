          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.8
      - text: "They claim that neither blossom, spring, nor singing bird has speech; so they say, yet it is false."
        coords:
