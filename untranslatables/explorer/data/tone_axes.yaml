          foreignising_vs_domesticating: 0.7
          concise_vs_glossed: -0.1
      - text: "I bumped into my tocayo—a fellow who shares my first name—out in the plaza, and we stood chatting for a good long while."
        coords:
          literal_vs_idiomatic: 0.5
          plain_vs_poetic: -0.2
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "I met my namesake in the square and we chatted awhile."
        coords:
          literal_vs_idiomatic: 0.8
          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: 0.8
          concise_vs_glossed: -0.9

  - id: friolero_invierno
    source: "Mi hermano es muy friolero y enciende la estufa en cuanto llega el otoño."
    translations:
      - text: "My brother is very friolero and lights the stove as soon as arrives the autumn."
        coords:
          literal_vs_idiomatic: -0.9
          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "My brother gets cold really easily and turns on the heater the minute fall starts."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.5
      - text: "My brother shivers at the merest breath of chill and kindles the hearth at autumn's first arrival."
        coords:
          literal_vs_idiomatic: 0.6
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: 0.7
          concise_vs_glossed: 0.1
      - text: "My brother is deeply friolero—always quick to feel the cold—so he switches on the heater the very moment autumn arrives."
        coords:
          literal_vs_idiomatic: 0.4
          plain_vs_poetic: -0.2
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "My brother hates the cold and puts the heat on in early autumn."
        coords:
          literal_vs_idiomatic: 0.8
          plain_vs_poetic: -0.9
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.8

  - id: rosalia_fuentes
    source: "Dicen que no hablan las plantas, ni las fuentes, ni los pájaros; lo dicen, pero no es cierto."
    translations:
      - text: "They say that do not speak the plants, nor the fountains, nor the birds; they say it, but it is not certain."
        coords:
          literal_vs_idiomatic: -1.0
          plain_vs_poetic: -0.3
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: -0.9
      - text: "People say plants, springs, and birds don't talk; they say that, but it isn't true."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.8
      - text: "They claim that neither blossom, spring, nor singing bird has speech; so they say, yet it is false."
        coords:
          literal_vs_idiomatic: 0.6
          plain_vs_poetic: 1.0
