          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "Today I'm wearing the new coat my grandmother gave me for the first time."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.7
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.5
      - text: "Today I shall christen the fresh coat my grandmother placed upon my shoulders."
        coords:
          literal_vs_idiomatic: 0.5
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: 0.6
          concise_vs_glossed: -0.2
      - text: "Today I get to estrenar—to wear with the small thrill of a first outing—the new coat my grandmother gave me."
        coords:
          literal_vs_idiomatic: 0.4
          plain_vs_poetic: 0.2
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "I'm finally breaking in the new coat Grandma got me today."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.8
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.8

  - id: verguenza_ajena
    source: "Al oír aquel discurso tan torpe, sentí una profunda vergüenza ajena."
    translations:
      - text: "Upon hearing that speech so clumsy, I felt a profound alien shame."
        coords:
          literal_vs_idiomatic: -0.9
          plain_vs_poetic: -0.2
          foreignising_vs_domesticating: -0.7
          concise_vs_glossed: -0.8
      - text: "Listening to such a clumsy speech, I felt intense secondhand embarrassment."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.6
      - text: "As that stumbling address unfolded, a keen vicarious shame flushed through me."
        coords:
          literal_vs_idiomatic: 0.6
          plain_vs_poetic: 0.8
          foreignising_vs_domesticating: 0.6
          concise_vs_glossed: -0.2
      - text: "Hearing such a clumsy speech, I felt a deep vergüenza ajena—that acute embarrassment one suffers on someone else's behalf."
        coords:
          literal_vs_idiomatic: 0.4
          plain_vs_poetic: 0.1
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: 0.9
      - text: "I cringed so hard listening to that awkward speech."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.9
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.9

  - id: becquer_golondrinas
    source: "Volverán las oscuras golondrinas en tu balcón sus nidos a colgar."
    translations:
      - text: "Will return the dark swallows on your balcony their nests to hang."
        coords:
          literal_vs_idiomatic: -1.0
          plain_vs_poetic: 0.2
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: -0.9
      - text: "The dark swallows will come back to build their nests on your balcony."
        coords:
          literal_vs_idiomatic: 0.8
          plain_vs_poetic: -0.7
          foreignising_vs_domesticating: 0.8
          concise_vs_glossed: -0.8
      - text: "Once more the dusky swallows shall return to hang their cradles from your balcony."
        coords:
          literal_vs_idiomatic: 0.6
          plain_vs_poetic: 1.0
          foreignising_vs_domesticating: 0.5
          concise_vs_glossed: -0.2
      - text: "The dark swallows will return to hang their nests upon your balcony, repeating nature's seasonal cycle as in Bécquer's inverted lyric syntax."
        coords:
          literal_vs_idiomatic: 0.3
          plain_vs_poetic: 0.1
          foreignising_vs_domesticating: -0.6
          concise_vs_glossed: 0.9
      - text: "Dark swallows will return again to hang their nests upon your balcony."
        coords:
          literal_vs_idiomatic: 0.5
          plain_vs_poetic: 0.6
          foreignising_vs_domesticating: 0.4
          concise_vs_glossed: -0.6

  - id: machado_caminante
    source: "Caminante, no hay camino, se hace camino al andar."
    translations:
      - text: "Walker, there is no road, road makes itself on walking."
        coords:
          literal_vs_idiomatic: -0.9
          plain_vs_poetic: -0.3
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: -0.9
      - text: "Traveler, there is no path; you make the path by walking."
        coords:
          literal_vs_idiomatic: 0.8
          plain_vs_poetic: -0.4
          foreignising_vs_domesticating: 0.8
          concise_vs_glossed: -0.7
      - text: "Wayfarer, there is no road laid down before you; the road is woven step by step as you go."
        coords:
          literal_vs_idiomatic: 0.7
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: 0.6
          concise_vs_glossed: 0.3
      - text: "Caminante—wandering traveler—there is no pre-existing road (camino); the path comes into being only through the act of walking."
        coords:
          literal_vs_idiomatic: 0.2
          plain_vs_poetic: 0.2
          foreignising_vs_domesticating: -0.8
          concise_vs_glossed: 0.9
      - text: "Traveler, there's no road—you forge it as you go."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.6
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.8

  - id: lorca_verde
    source: "Verde que te quiero verde. Verde viento. Verdes ramas."
    translations:
      - text: "Green that I want you green. Green wind. Green branches."
        coords:
          literal_vs_idiomatic: -1.0
          plain_vs_poetic: 0.1
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.9
      - text: "Green, how I love you green. Green wind. Green boughs."
        coords:
          literal_vs_idiomatic: 0.6
          plain_vs_poetic: 0.9
          foreignising_vs_domesticating: 0.4
          concise_vs_glossed: -0.8
      - text: "I want everything green: the wind is green and the branches are green."
        coords:
          literal_vs_idiomatic: 0.8
          plain_vs_poetic: -0.9
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.4
      - text: "Verde que te quiero verde—green, how fiercely I desire and love you green (carrying Lorca's double sense of querer)—green wind, green boughs."
        coords:
          literal_vs_idiomatic: 0.1
          plain_vs_poetic: 0.5
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: 1.0
      - text: "O green, how deeply I yearn for you in green—emerald wind, verdant boughs."
        coords:
          literal_vs_idiomatic: 0.7
          plain_vs_poetic: 1.0
          foreignising_vs_domesticating: 0.7
          concise_vs_glossed: 0.1

  - id: siesta_patio
    source: "En agosto, después de comer, el pueblo entero se rendía a la siesta tras las persianas."
    translations:
      - text: "In August, after eating, the whole village surrendered itself to the siesta behind the persianas."
        coords:
          literal_vs_idiomatic: -0.9
          plain_vs_poetic: -0.3
          foreignising_vs_domesticating: -0.9
          concise_vs_glossed: -0.8
      - text: "In August, after lunch, the whole town took an afternoon nap behind closed blinds."
        coords:
          literal_vs_idiomatic: 0.9
          plain_vs_poetic: -0.7
          foreignising_vs_domesticating: 0.9
          concise_vs_glossed: -0.7
      - text: "Each August, once the midday meal was done, the entire village yielded to the hushed spell of the siesta behind shuttered windows."
        coords:
