# Sentence test set for the sentence-level untranslatability experiments (../HANDOFF_sentence_untranslatability.md §4).
# Drafted by Claude Code (Opus 5.5), 19 Nov 2026.  UNCHECKED: stop point 1. Please check it (and ask your father) before any GPU run.
#
# Schema (validated by `python -m sent.data`):
#   id        unique, <lang>_<slug>
#   lang      es | it | pt | fr | de | hi | rom
#   category  untranslatable_in_context | construction | idiom | control | dialect
#   text      the sentence exactly as it will be shown to the model
#   hot       expected hard parts, as substrings of `text` (first occurrence; write "x#2" for the 2nd occurrence).
#             Character offsets are computed by the loader and written into every output, so you never type them.
#   probe     (controls only) one plain content word, used as the "easy" comparison span for spread (§1).
#   senses    {span: {en: intended sense in this sentence, src: the same in the source language (es, hi)}}
#   draft     true = not yet checked by a speaker (all Hindi items)
#   notes, source
#   optional  true = dropped unless the run asks for it (`--dialect`), as the handoff's schedule allows.
#
# Every sentence is invented (source: invented) except the father's example and the two Belli lines.

sentences:

# ---------------------------------------------------------------- untranslatable_in_context (12)
- id: es_duende
  lang: es
  category: untranslatable_in_context
  text: Me gusta mucho el duende.
  hot: [duende, gusta]
  senses:      # intended sense in THIS sentence: en (English gloss), src (source-language gloss; es/hi only)
    duende:
      en: "the mysterious, almost demonic power of a great artistic performance to move people (Lorca's sense)"
      src: "el poder misterioso, casi demoníaco, de una gran interpretación artística para conmover"
    gusta:
      en: "pleases me, appeals to my taste (the thing liked is the subject)"
      src: "me agrada, es de mi gusto"
  notes: >-
    The father's running example. duende = the mysterious power of art to move (Lorca, flamenco), also 'goblin';
    gusta = the thing pleases me (gustar construction), and the verb is related to taste. Validation (§6.3) checks
    that the leftover orders duende > gusta > mucho.
  source: the father's example

