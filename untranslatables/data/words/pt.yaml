- word: saudade
  category: untranslatable
  emotion: true
  gloss_en: an aching longing for someone or something absent, often loved and possibly never to return
  senses:
    - label: longing for an absent person or place
      clarify: 'Aqui, "saudade" é a falta que se sente de uma pessoa ou de um lugar que está longe.'
    - label: nostalgia for a past that is gone
      clarify: 'Aqui, "saudade" é a lembrança melancólica de um tempo passado que não volta.'
    - label: wistful yearning for what never was
      clarify: 'Aqui, "saudade" é o desejo vago de algo que talvez nunca tenha existido.'
  gloss_src: 'Saudade: sentimento de falta e desejo de alguém ou de algo ausente, misturado com a lembrança do que se viveu. Exemplo: "Quando emigrou, levou consigo a saudade da aldeia."'
  source: TODO
  notes: Seed example in the handoff; the canonical Portuguese untranslatable. Lead recipe card.
  exclude_from_pool: []
  frames:
    - 'Sinto [[saudade]].'
    - 'Estou cheio de [[saudade]].'
  contexts:
    - 'Desde que ela partiu para Lisboa, a [[saudade]] não me deixa dormir.'
    - 'O fado canta a [[saudade]] de quem ficou no cais a ver o barco partir.'
    - 'Tenho [[saudade]] dos verões na casa da minha avó.'
    - 'Há uma [[saudade]] estranha de coisas que nunca aconteceram.'
    - 'Mata a [[saudade]] e telefona à tua mãe.'
  extra:
    - 'Já passaram três anos. Escrevemos cartas, mas não é a mesma coisa.'
    - 'Às sextas-feiras íamos todos à tasca da esquina. Ainda hoje passo lá à porta.'

- word: cafuné
  category: untranslatable
  emotion: false
  gloss_en: tenderly running one's fingers through someone's hair (Brazilian Portuguese)
  senses:
    - label: the act of stroking someone's hair affectionately
      clarify: 'Aqui, "cafuné" é o gesto de passar os dedos devagar pelo cabelo de alguém, com carinho.'
  gloss_src: 'Cafuné: carícia feita passando suavemente os dedos pelo cabelo ou couro cabeludo de alguém. Exemplo: "A mãe fazia cafuné no filho até ele adormecer."'
  source: TODO
  notes: Often listed as untranslatable; arguably a single clear reading with no one-word English equivalent (gap without multiplicity).
  exclude_from_pool: []
  contexts:
    - 'Ela deitou a cabeça no meu colo e pediu um [[cafuné]].'
    - 'Não há nada melhor do que um [[cafuné]] depois de um dia cansativo.'
    - 'A avó fazia [[cafuné]] nos netos enquanto contava histórias.'
    - 'O gato fecha os olhos quando recebe [[cafuné]] atrás das orelhas.'
    - 'Adormeci no sofá com o [[cafuné]] da minha namorada.'
  extra:
    - 'Chegou a casa com dor de cabeça e deitou-se no sofá. Ninguém disse nada durante um bocado.'
    - 'Era um domingo de chuva. Estávamos todos na sala, sem vontade de sair.'

- word: jeitinho
  category: untranslatable
  emotion: false
  gloss_en: (Brazilian) a clever, informal way round a rule or obstacle, often through charm or personal connections
  senses:
    - label: a resourceful workaround
      clarify: 'Aqui, "jeitinho" é uma solução engenhosa e improvisada para um problema prático.'
    - label: bending rules through favours or charm
      clarify: 'Aqui, "jeitinho" é contornar uma regra com simpatia, favores ou conhecimentos pessoais.'
  gloss_src: 'Jeitinho: maneira hábil e informal de resolver uma situação difícil, muitas vezes contornando regras com simpatia ou conhecimentos. Exemplo: "Não havia mesa livre, mas ele deu um jeitinho e conseguimos jantar."'
  source: TODO
  notes: Socio-cultural untranslatable; positive and negative readings coexist.
  exclude_from_pool: []
  contexts:
    - 'O prazo já tinha acabado, mas o funcionário deu um [[jeitinho]] e aceitou o meu pedido.'
    - 'Com um [[jeitinho]] a mala acabou por fechar.'
    - 'Há quem diga que o [[jeitinho]] brasileiro é uma forma de sobrevivência.'
    - 'Ele conseguiu o emprego à base de [[jeitinho]], não de mérito.'
    - 'Dá um [[jeitinho]] e arranja-me dois bilhetes para o concerto.'
  extra:
    - 'A fila estava enorme e faltavam documentos. Eu já estava a perder a esperança.'
    - 'Tínhamos roupa para uma semana e só uma mala pequena. Tentámos várias vezes.'

