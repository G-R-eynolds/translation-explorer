- word: sprezzatura
  category: untranslatable
  emotion: false
  gloss_en: studied nonchalance; making difficult things look effortless (Castiglione)
  senses:
    - label: effortless grace that hides effort
      clarify: 'Qui "sprezzatura" è la grazia disinvolta di chi fa sembrare facile una cosa difficile.'
    - label: affected nonchalance, studied carelessness (style)
      clarify: 'Qui "sprezzatura" è una trascuratezza studiata nell''abbigliamento o nei modi, fatta apposta per sembrare naturale.'
  gloss_src: 'Sprezzatura: disinvoltura elegante che nasconde lo sforzo e l''artificio, termine reso celebre da Castiglione nel "Cortegiano". Esempio: "Suonava il pianoforte con una sprezzatura che incantava tutti."'
  source: TODO
  notes: Very low frequency (Zipf 1.5); familiarity gate likely to matter.
  exclude_from_pool: []
  contexts:
    - 'Castiglione raccomanda al cortigiano una certa [[sprezzatura]] in ogni cosa.'
    - 'Portava la giacca sbottonata con calcolata [[sprezzatura]].'
    - 'Risolse il problema con una [[sprezzatura]] che ci lasciò senza parole.'
    - 'La moda maschile italiana ha fatto della [[sprezzatura]] un marchio.'
    - 'Dietro quella [[sprezzatura]] c''erano anni di esercizio.'
  extra:
    - 'Il libro descrive il gentiluomo ideale della corte di Urbino. Deve saper fare tutto, ma senza mostrarlo.'
    - 'Al matrimonio tutti erano vestiti in modo impeccabile. Lui invece aveva la cravatta un po'' allentata.'

- word: magari
  category: untranslatable
  emotion: false
  gloss_en: (interj.) if only!; (adv.) maybe, perhaps; even
  senses:
    - label: if only! (wish)
      clarify: 'Qui "magari" esprime un desiderio forte, come per dire che si vorrebbe tanto che fosse vero.'
    - label: maybe, perhaps
      clarify: 'Qui "magari" indica una possibilità: forse, può darsi.'
    - label: even, possibly (concessive)
      clarify: 'Qui "magari" significa "perfino, addirittura", in senso ipotetico.'
  gloss_src: 'Magari: (1) esclamazione che esprime un desiderio; (2) avverbio che indica una possibilità; (3) avverbio con valore di "perfino, addirittura". Esempio: "Vinceremo?" "Magari!"; "Magari domani piove."'
  source: TODO
  notes: Function-word untranslatable; high frequency. Ordinary control is the adverb 'domani' (POS-matched).
  exclude_from_pool: []
  sense_of_context: [0, 1, 2, 1, 0]
  contexts:
    - '"Hai vinto alla lotteria?" "[[Magari]]!"'
    - '[[Magari]] domani piove e non possiamo andare al mare.'
    - 'Sarebbe capace di uscire [[magari]] anche con la febbre.'
    - 'Passa a trovarci, [[magari]] sabato.'
    - '[[Magari]] fossi ancora giovane!'
  extra:
    - 'Parlavamo dei soldi che non bastano mai. Lui ha fatto una battuta sulla fortuna.'
    - 'Le previsioni non sono sicure. Il cielo è nuvoloso da stamattina.'

- word: menefreghismo
  category: untranslatable
  emotion: false
  gloss_en: a defiant 'I don't give a damn' attitude, studied indifference (from 'me ne frego')
  senses:
    - label: personal indifference, not caring
      clarify: 'Qui "menefreghismo" è l''atteggiamento di chi se ne infischia delle regole e degli altri.'
    - label: the Fascist-era motto 'me ne frego' as attitude
      clarify: 'Qui "menefreghismo" indica il motto e l''atteggiamento sprezzante esaltato dal fascismo.'
  gloss_src: 'Menefreghismo: atteggiamento di chi ostenta indifferenza verso doveri, regole o conseguenze ("me ne frego"). Esempio: "Il menefreghismo di certi automobilisti è pericoloso."'
  source: TODO
  notes: Historically loaded (Fascist slogan).
  exclude_from_pool: []
  contexts:
    - 'Il [[menefreghismo]] di certi automobilisti mette tutti in pericolo.'
    - 'Lo accusano di [[menefreghismo]] verso i problemi della città.'
    - 'Il [[menefreghismo]] fu esaltato dalla propaganda del Ventennio.'
    - 'Quel [[menefreghismo]] è solo una maschera per la sua timidezza.'
    - 'In ufficio regna un [[menefreghismo]] generale.'
  extra:
    - 'Le strisce pedonali sono appena state ridipinte. Eppure nessuno si ferma.'
    - 'Il quartiere è pieno di rifiuti da settimane. Il sindaco non ha detto nulla.'

- word: abbiocco
  category: untranslatable
  emotion: false
  gloss_en: (colloquial, central Italy) the drowsiness that comes after a big meal
  senses:
    - label: post-meal drowsiness
      clarify: 'Qui "abbiocco" è la sonnolenza che viene dopo aver mangiato molto.'
  gloss_src: 'Abbiocco: (regionale, colloquiale) improvvisa sonnolenza, specialmente dopo un pasto abbondante. Esempio: "Dopo la pasta al forno mi è venuto l''abbiocco."'
  source: TODO
  notes: Etymologically from 'biocca' (broody hen) -- links to Belli's 'bbiocca'. Regional, low frequency.
  exclude_from_pool: []
  contexts:
    - 'Dopo il pranzo della domenica arriva puntuale l''[[abbiocco]].'
    - 'Ho avuto un [[abbiocco]] davanti alla televisione.'
    - 'Per combattere l''[[abbiocco]] bevo un caffè.'
    - 'Alle tre del pomeriggio in ufficio è [[abbiocco]] generale.'
    - 'L''[[abbiocco]] mi ha preso proprio durante la riunione.'
  extra:
    - 'La nonna aveva cucinato lasagne, arrosto e patate. Abbiamo finito con il tiramisù.'
    - 'Il treno era caldo e silenzioso. Avevo appena mangiato un panino.'

