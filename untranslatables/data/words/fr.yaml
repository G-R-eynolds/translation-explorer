- word: esprit de l'escalier
  category: untranslatable
  emotion: false
  gloss_en: thinking of the perfect retort only after the moment has passed (Diderot)
  senses:
    - label: the too-late witty reply
      clarify: 'Ici, « l''esprit de l''escalier » désigne la répartie qu''on trouve trop tard, une fois la conversation finie.'
  gloss_src: 'Esprit de l''escalier : le fait de trouver la bonne réponse ou la remarque spirituelle seulement après coup, quand l''occasion est passée (expression venue de Diderot). Exemple : « J''ai eu l''esprit de l''escalier : la réplique parfaite m''est venue dans le métro. »'
  source: TODO
  notes: Multi-word expression; the span covers all its tokens.
  exclude_from_pool: []
  contexts:
    - 'J''ai eu l''[[esprit de l''escalier]] : la réplique parfaite m''est venue dans le métro.'
    - 'Diderot a donné son nom à l''[[esprit de l''escalier]].'
    - 'Souffrant d''[[esprit de l''escalier]], il rejouait toutes ses disputes la nuit.'
    - 'C''est l''[[esprit de l''escalier]] qui fait les meilleurs romanciers.'
    - 'Encore un cas d''[[esprit de l''escalier]] : je n''ai rien su répondre.'
  extra:
    - 'En réunion, un collègue s''est moqué de mon projet devant tout le monde. Je suis resté muet.'
    - 'Le philosophe raconte une soirée mondaine où on l''avait déstabilisé.'

