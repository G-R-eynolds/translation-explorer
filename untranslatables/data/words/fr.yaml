      clarify: 'Ici, « retrouvailles » désigne une rencontre organisée entre personnes qui ne s''étaient pas vues depuis longtemps.'
  gloss_src: 'Retrouvailles : le fait de se retrouver après une séparation, et l''émotion qui l''accompagne. Exemple : « Les retrouvailles à l''aéroport furent pleines de larmes. »'
  source: TODO
  notes: Plural-only noun.
  exclude_from_pool: []
  contexts:
    - 'Les [[retrouvailles]] à l''aéroport furent pleines de larmes.'
