- word: dépaysement
  category: untranslatable
  emotion: true
  gloss_en: the disorientation (pleasant or not) of being out of one's usual surroundings, especially abroad
  senses:
    - label: unsettling disorientation, culture shock
      clarify: 'Ici, « dépaysement » désigne le malaise de celui qui ne retrouve plus ses repères.'
    - label: refreshing change of scene
      clarify: 'Ici, « dépaysement » désigne le plaisir d''un changement complet de décor et d''habitudes.'
  gloss_src: 'Dépaysement : sentiment d''être hors de son cadre habituel, qui peut être agréable (changement de décor) ou déstabilisant (perte de repères). Exemple : « Pour le dépaysement, rien ne vaut un voyage en Islande. »'
  source: TODO
  notes: Valence flips between senses -- a clean multiplicity case.
  exclude_from_pool: []
  frames:
    - 'Je ressens du [[dépaysement]].'
    - 'Je suis en plein [[dépaysement]].'
  contexts:
    - 'Pour le [[dépaysement]], rien ne vaut une semaine au Japon.'
    - 'Les premiers mois à Paris, il a souffert d''un profond [[dépaysement]].'
    - 'Ce petit village offre un [[dépaysement]] total à deux heures de la ville.'
    - 'Le [[dépaysement]] de l''exil se lit dans ses poèmes.'
    - 'Les touristes viennent chercher le [[dépaysement]] et trouvent des chaînes de magasins.'
  extra:
    - 'Après deux ans de bureau sans vacances, ils ont tout lâché pour un mois. Ils voulaient voir autre chose.'
    - 'Il avait quitté son pays à dix-neuf ans. Il ne parlait pas encore la langue.'

- word: flâner
  category: untranslatable
  emotion: false
  gloss_en: to stroll aimlessly, savouring the city (cf. the flâneur)
  senses:
    - label: to stroll idly for pleasure
      clarify: 'Ici, « flâner » veut dire se promener sans but, pour le plaisir.'
    - label: to dawdle, waste time
      clarify: 'Ici, « flâner » veut dire traîner, perdre son temps au lieu de travailler.'
  gloss_src: 'Flâner : se promener sans but précis, en prenant son temps et en observant ce qui se passe autour de soi. Exemple : « Le dimanche, nous aimons flâner sur les quais de la Seine. »'
  source: TODO
  notes: Verb. Control is the verb 'tricoter'.
  exclude_from_pool: []
  contexts:
    - 'Le dimanche, j''aime [[flâner]] le long des quais.'
    - 'Baudelaire passait des heures à [[flâner]] dans les passages couverts.'
    - 'Arrête de [[flâner]] et viens m''aider !'
    - 'Nous avons passé l''après-midi à [[flâner]] dans les ruelles du Marais.'
    - 'Il n''y a pas de meilleure façon de découvrir une ville que de [[flâner]].'
  extra:
    - 'Il faisait beau et nous n''avions rien de prévu. La ville était calme.'
    - 'Le poète venait d''arriver à Paris. Tout l''étonnait.'

- word: retrouvailles
