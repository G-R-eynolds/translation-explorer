words:

- word: Sehnsucht
  category: untranslatable
  emotion: true
  gloss_en: an intense, often bittersweet yearning for something distant, lost or unattainable
  senses:
    - label: longing for a person or place
      clarify: 'Hier ist „Sehnsucht“ das starke Verlangen nach einem Menschen oder Ort, der fern ist.'
    - label: yearning for the unattainable or infinite (Romantic)
      clarify: 'Hier ist „Sehnsucht“ ein unbestimmtes Verlangen nach etwas Unerreichbarem, Fernem oder Unendlichem.'
  gloss_src: 'Sehnsucht: inniges, oft schmerzliches Verlangen nach jemandem oder etwas, das fern oder unerreichbar ist. Beispiel: „Die Sehnsucht nach dem Meer ließ ihn nicht los.“'
  source: TODO
  notes: Romantic key term; the second sense is the Cassin-type one.
  exclude_from_pool: []
  frames:
    - 'Ich fühle [[Sehnsucht]].'
    - 'Ich bin voller [[Sehnsucht]].'
  contexts:
    - 'Nach drei Monaten im Ausland packte sie die [[Sehnsucht]] nach ihrer Familie.'
    - 'In den Gedichten der Romantik ist die [[Sehnsucht]] nach dem Unendlichen allgegenwärtig.'
    - 'Er schaute dem Zug mit [[Sehnsucht]] hinterher.'
    - 'Diese [[Sehnsucht]] nach etwas, das ich nicht benennen kann, kommt jeden Herbst wieder.'
    - 'Die [[Sehnsucht]] nach Ruhe trieb ihn aufs Land.'
  extra:
    - 'Das Praktikum in Kanada war spannend. Doch an den Wochenenden war die Wohnung sehr still.'
    - 'Novalis schrieb von der blauen Blume. Seine Figuren sind immer unterwegs.'

- word: Heimat
  category: untranslatable
  emotion: false
  gloss_en: home(land) as a place of belonging, identity and emotional attachment, not just residence
  senses:
    - label: homeland, place of origin
      clarify: 'Hier ist „Heimat“ der Ort oder das Land, aus dem man stammt.'
    - label: sense of belonging and identity
      clarify: 'Hier ist „Heimat“ das Gefühl, irgendwo dazuzugehören und geborgen zu sein, unabhängig vom Ort.'
  gloss_src: 'Heimat: Ort, Gegend oder Land, wo man aufgewachsen ist oder sich zugehörig und geborgen fühlt. Beispiel: „Nach vielen Jahren im Ausland kehrte sie in ihre Heimat zurück.“'
  source: TODO
  notes: Politically loaded in German (Heimatministerium, Heimatfilm); English home/homeland each miss part.
  exclude_from_pool: []
  contexts:
    - 'Nach dem Krieg verloren viele Menschen ihre [[Heimat]].'
    - 'Für mich ist Musik eine Art [[Heimat]].'
    - 'Er spricht noch immer den Dialekt seiner [[Heimat]].'
    - 'Berlin ist längst ihre zweite [[Heimat]] geworden.'
    - 'Der Film erzählt von [[Heimat]], Abschied und Rückkehr.'
  extra:
    - 'Sie kam als Kind aus Schlesien. Die Familie musste alles zurücklassen.'
    - 'Ich bin oft umgezogen und habe nirgends lange gewohnt. Freunde kamen und gingen.'

- word: Fernweh
  category: untranslatable
  emotion: true
  gloss_en: an ache to be far away, a longing for distant places one has not been to (opposite of homesickness)
  senses:
    - label: longing to travel to faraway places
      clarify: 'Hier ist „Fernweh“ der starke Wunsch, in die Ferne zu reisen.'
  gloss_src: 'Fernweh: Sehnsucht nach fernen Ländern und danach, zu reisen; Gegenteil von Heimweh. Beispiel: „Beim Anblick der Flugzeuge bekam er Fernweh.“'
  source: TODO
  notes: Gap word with one fairly clear reading; contrast with Sehnsucht.
  exclude_from_pool: []
  frames:
    - 'Ich fühle [[Fernweh]].'
    - 'Ich habe [[Fernweh]].'
  contexts:
    - 'Im grauen November packt mich jedes Jahr das [[Fernweh]].'
    - 'Die Reisekataloge verstärkten nur ihr [[Fernweh]].'
    - 'Er litt nicht an Heimweh, sondern an [[Fernweh]].'
    - 'Das [[Fernweh]] trieb sie nach dem Abitur nach Südamerika.'
    - 'Am Hafen bekomme ich immer [[Fernweh]].'

- word: Weltschmerz
  category: untranslatable
  emotion: true
  gloss_en: world-weariness; sorrow at the gap between the world as it is and as it should be
  senses:
    - label: melancholy about the state of the world
      clarify: 'Hier ist „Weltschmerz“ die Traurigkeit über die Unvollkommenheit der Welt.'
    - label: vague world-weary malaise (mood)
      clarify: 'Hier ist „Weltschmerz“ eine diffuse, müde Lustlosigkeit ohne bestimmten Grund.'
  gloss_src: 'Weltschmerz: tiefe Traurigkeit über die Unzulänglichkeit der Welt und das eigene Leiden daran. Beispiel: „Nach den Nachrichten überkam ihn ein Anflug von Weltschmerz.“'
  source: TODO
  notes: Also borrowed into English (rare), so a partial loan.
  exclude_from_pool: []
  frames:
    - 'Ich fühle [[Weltschmerz]].'
    - 'Ich bin voller [[Weltschmerz]].'
  contexts:
    - 'Die Gedichte Heines sind voller [[Weltschmerz]].'
    - 'Nach den Abendnachrichten überkam ihn ein Anflug von [[Weltschmerz]].'
    - 'Mit sechzehn hatte ich einen ausgeprägten [[Weltschmerz]].'
    - 'Der [[Weltschmerz]] der Romantiker ist heute fast ein Klischee.'
    - 'Gegen [[Weltschmerz]] hilft manchmal ein Spaziergang.'
  extra:
    - 'Er las über Kriege, Hunger und Klimakatastrophen. Dann klappte er den Laptop zu.'
    - 'Sie saß am Fenster und schaute in den Regen. Nichts schien einen Sinn zu haben.'

- word: Gemütlichkeit
  category: untranslatable
  emotion: false
  gloss_en: cosy, unhurried warmth and conviviality; a state of comfortable belonging
  senses:
    - label: physical cosiness of a place
      clarify: 'Hier ist „Gemütlichkeit“ die warme, behagliche Atmosphäre eines Ortes.'
    - label: relaxed sociability, good company
      clarify: 'Hier ist „Gemütlichkeit“ das entspannte, gesellige Beisammensein ohne Eile.'
  gloss_src: 'Gemütlichkeit: Zustand von Behaglichkeit, Wärme und entspannter Geselligkeit. Beispiel: „Kerzen und ein Kachelofen sorgten für Gemütlichkeit.“'
  source: TODO
  notes: English 'cosiness' covers the first sense only; compare with English 'cosy' in the reverse direction.
  exclude_from_pool: []
  contexts:
    - 'Der Kachelofen sorgt im Winter für [[Gemütlichkeit]].'
    - 'In dieser Kneipe herrscht echte [[Gemütlichkeit]].'
    - 'Bei aller [[Gemütlichkeit]] müssen wir heute noch arbeiten.'
    - 'Die Wiener Kaffeehäuser sind berühmt für ihre [[Gemütlichkeit]].'
    - 'Weihnachtsmärkte verkaufen vor allem [[Gemütlichkeit]].'
  extra:
    - 'Draußen lag Schnee. Wir hatten den ganzen Nachmittag nichts vor.'
    - 'Die Freunde kamen gegen sieben. Niemand schaute auf die Uhr.'

