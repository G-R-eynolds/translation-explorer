# Distinction-collapse items (handoff §6.3).  Written by Claude Code (Opus 5.5), 18 Nov 2026; UNCHECKED --
# every sentence, its English version and its expected class need a human check.
#
# Item types:
#   english_lacks   source and target share a distinction English collapses (savoir/connaître -> saber/conocer,
#                   'know'); the excess error rate over the matched control is the behavioural English-bias score.
#   english_keeps   matched control: a distinction all three languages make (regarder/voir -> mirar/ver, look/see).
#   english_splits  source and target share ONE word where English needs two (it 'tempo' -> es 'tiempo'; English
#                   time/weather); the error is the target word for the English split ('clima').
# Each pair lists target-language regexes per class.  An output is scored 'correct' if it matches the expected
# class and no other, 'error' if it matches another class but not the expected one, otherwise 'other'
# (paraphrase, both, or neither).  Error rate = error / (correct + error); 'other' is reported separately.
# `en` is the English version, used for the English side of the steering vector (§6.4).

pairs:

# ---------------------------------------------------------------- fr -> es: savoir / connaître  (English: know)
