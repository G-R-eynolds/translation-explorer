# ---------------------------------------------------------------- it -> es: tempo -> tiempo  (English: time / weather)
- id: it-es_tempo
  src: it
  tgt: es
  type: english_splits
  control: it-es_guardare-vedere
  english_split: {time: [time], weather: [weather]}
  # Expected class is always 'tiempo'; the error is the Spanish word for the English split (clima for
  # weather; hora/rato/momento for clock-time readings, which only some items invite).
  classes:
    tiempo: ['\btiempo\b']
    clima: ['\bclima\w*', '\bmeteorol\w*']
    hora: ['\bhora\b', '\bhoras\b']
  items:
    - {s: "Che tempo fa oggi a Roma?", en: "What is the weather like in Rome today?", x: tiempo, sense: weather}
    - {s: "Non ho tempo per queste cose.", en: "I don't have time for these things.", x: tiempo, sense: time}
    - {s: "Il tempo è bellissimo questa mattina.", en: "The weather is beautiful this morning.", x: tiempo, sense: weather}
    - {s: "Il tempo vola quando ci si diverte.", en: "Time flies when you're having fun.", x: tiempo, sense: time}
    - {s: "Con questo tempo non usciamo.", en: "We are not going out in this weather.", x: tiempo, sense: weather}
    - {s: "Ci vuole tempo per imparare una lingua.", en: "It takes time to learn a language.", x: tiempo, sense: time}
    - {s: "Domani il tempo dovrebbe migliorare.", en: "The weather should improve tomorrow.", x: tiempo, sense: weather}
    - {s: "Abbiamo poco tempo prima del treno.", en: "We have little time before the train.", x: tiempo, sense: time}
    - {s: "Il tempo in montagna cambia in fretta.", en: "The weather in the mountains changes quickly.", x: tiempo, sense: weather}
    - {s: "Quanto tempo ci vuole per arrivare?", en: "How much time does it take to get there?", x: tiempo, sense: time}
    - {s: "Fa brutto tempo da una settimana.", en: "The weather has been bad for a week.", x: tiempo, sense: weather}
    - {s: "Ho perso molto tempo in coda.", en: "I wasted a lot of time in the queue.", x: tiempo, sense: time}
