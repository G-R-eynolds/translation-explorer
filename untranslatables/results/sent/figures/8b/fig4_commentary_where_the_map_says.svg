  <g id="text_17">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #6b6a66" transform="translate(9.504 352.96054)">How to read this: starting from the same standard translation, the model added short bracketed glosses either to the words the heat map</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #6b6a66" transform="translate(9.504 366.163548)">marked or to random words (same number of glosses). Taller = more of the lost meaning recovered. Lines show the 95% range.</text>
  </g>
