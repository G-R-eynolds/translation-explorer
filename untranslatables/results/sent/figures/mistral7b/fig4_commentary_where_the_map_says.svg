  <g id="text_17">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f1f1e" x="9.504" y="17.7735" transform="rotate(-0 9.504 17.7735)">Glossing the marked words did not reliably beat glossing random words</text>
